name: E2E Tests (Frontend)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: pizzaria
          POSTGRES_PASSWORD: pizzaria123
          POSTGRES_DB: pizzaria
        options: >-
          --health-cmd "pg_isready -U pizzaria -d pizzaria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Setup backend
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: ./backend
      - run: npx prisma generate
        working-directory: ./backend
      - run: npx prisma migrate deploy
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://pizzaria:pizzaria123@localhost:5432/pizzaria?schema=public
      - run: npm run dev &
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://pizzaria:pizzaria123@localhost:5432/pizzaria?schema=public
          PORT: "3333"
          CORS_ORIGIN: "http://localhost:3000"
          JWT_SECRET: "test-secret"
          VAPID_PUBLIC_KEY: "BCh5az1teMFHC5QTv45MQjHxZQqdM7bo0KGJibevgPsk8FjAiHB-WYp1ITlRDVyAOq5xRUCyH51vS8CFdbV8i0Y"
          VAPID_PRIVATE_KEY: "k6RjGAzCq7wGkhv_pklKLb1kibMb1vx9ZptOZ5qXiZ4"
          VAPID_SUBJECT: "mailto:test@test.com"
      # Start frontend
      - run: npm run dev &
        working-directory: ./frontend
      - run: sleep 15 && curl -f http://localhost:3333/health && curl -f http://localhost:3000
      - run: npm run test:e2e
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7