name: Integration Tests (Backend)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pizzaria_test
        options: >-
          --health-cmd "pg_isready -U test -d pizzaria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --force-reset
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/pizzaria_test?schema=public
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/pizzaria_test?schema=public
          VAPID_PUBLIC_KEY: "BCh5az1teMFHC5QTv45MQjHxZQqdM7bo0KGJibevgPsk8FjAiHB-WYp1ITlRDVyAOq5xRUCyH51vS8CFdbV8i0Y"
          VAPID_PRIVATE_KEY: "k6RjGAzCq7wGkhv_pklKLb1kibMb1vx9ZptOZ5qXiZ4"
          VAPID_SUBJECT: "mailto:test@test.com"